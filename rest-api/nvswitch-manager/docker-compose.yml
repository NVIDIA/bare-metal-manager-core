version: '3.8'

services:
  postgres:
    image: postgres
    container_name: nsm_postgres
    environment:
      POSTGRES_USER: nsmuser
      POSTGRES_PASSWORD: nsmpassword
      POSTGRES_DB: nsmdatabase
    ports:
      - "5432:5432"
    networks:
      - nsm_network

networks:
  nsm_network:
    driver: bridge
