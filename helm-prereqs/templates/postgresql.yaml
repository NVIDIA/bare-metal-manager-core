{{- if .Values.postgresql.enabled }}
{{- $dbUsers := list (dict "secret" "nico-system-db-user" "username" "nico-system.nico") -}}
{{- if .Values.rest.enabled -}}
{{- $dbUsers = append $dbUsers (dict "secret" "nico-rest-db-user" "username" "nico-rest.nico") -}}
{{- end -}}
{{- if .Values.flow.enabled -}}
{{- $dbUsers = append $dbUsers (dict "secret" "flow-db-user" "username" "flow.nico") -}}
{{- $dbUsers = append $dbUsers (dict "secret" "psm-db-user" "username" "psm.nico") -}}
{{- $dbUsers = append $dbUsers (dict "secret" "nsm-db-user" "username" "nsm.nico") -}}
{{- end -}}
## Role passwords are retained across upgrades and projected by ESO.
{{ range $dbUser := $dbUsers }}
{{- $password := randAlphaNum 32 | b64enc -}}
{{- $existing := lookup "v1" "Secret" $.Values.postgresNamespace $dbUser.secret -}}
{{- if and $existing $existing.data (hasKey $existing.data "password") -}}
{{- $password = index $existing.data "password" -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbUser.secret }}
  namespace: {{ $.Values.postgresNamespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
data:
  username: {{ $dbUser.username | b64enc | quote }}
  password: {{ $password | quote }}
{{ end }}

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nico-pg-cluster
  namespace: {{ .Values.postgresNamespace }}
spec:
  instances: {{ .Values.postgresql.instances }}
  imageName: {{ .Values.postgresql.imageName | quote }}
  {{- with .Values.postgresql.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  env:
    - name: TMP_SITE
      value: {{ .Values.siteName | quote }}
  storage:
    size: {{ .Values.postgresql.volumeSize }}
    storageClass: {{ .Values.postgresql.storageClass | quote }}
  resources:
    limits:
      cpu: {{ .Values.postgresql.resources.limits.cpu | quote }}
      memory: {{ .Values.postgresql.resources.limits.memory | quote }}
    requests:
      cpu: {{ .Values.postgresql.resources.requests.cpu | quote }}
      memory: {{ .Values.postgresql.resources.requests.memory | quote }}
  bootstrap:
    initdb:
      database: nico_system_nico
      owner: nico-system.nico
      secret:
        name: nico-system-db-user
  managed:
    roles:
      {{- range $dbUser := $dbUsers }}
      - name: {{ $dbUser.username }}
        ensure: present
        login: true
        superuser: true
        createdb: true
        passwordSecret:
          name: {{ $dbUser.secret }}
      {{- end }}
  postgresql:
{{ if .Values.postgresql.synchronousMode }}
    synchronous:
      method: any
      number: 1
      dataDurability: required
{{ end }}
    parameters:
      max_connections: "1024"
      synchronous_commit: "remote_apply"
      lock_timeout: "2min"
      statement_timeout: "10min"
      idle_in_transaction_session_timeout: "15min"
      idle_session_timeout: "60min"

{{- if .Values.rest.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: nico-rest-database
  namespace: {{ .Values.postgresNamespace }}
  labels:
    nico.nvidia.com/postgresql-cluster: nico-pg-cluster
spec:
  name: nico_rest
  owner: nico-rest.nico
  cluster:
    name: nico-pg-cluster
  databaseReclaimPolicy: retain
  extensions:
    - name: btree_gin
      ensure: present
    - name: pg_trgm
      ensure: present
{{- end }}

{{- if .Values.flow.enabled }}
{{- range $database := list
      (dict "resource" "flow-database" "name" "flow" "owner" "flow.nico")
      (dict "resource" "psm-database" "name" "psm" "owner" "psm.nico")
      (dict "resource" "nsm-database" "name" "nsm" "owner" "nsm.nico") }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $database.resource }}
  namespace: {{ $.Values.postgresNamespace }}
  labels:
    nico.nvidia.com/postgresql-cluster: nico-pg-cluster
spec:
  name: {{ $database.name }}
  owner: {{ $database.owner }}
  cluster:
    name: nico-pg-cluster
  databaseReclaimPolicy: retain
{{- end }}
{{- end }}
{{- end }}
