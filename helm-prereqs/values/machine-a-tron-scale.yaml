# =============================================================================
# machine-a-tron-scale.yaml — LARGE-SCALE site values (Controller Mode)
#
# For scale testing NICo ingestion with hundreds to thousands of simulated
# hosts. The mat-k8s-controller dynamically creates ClusterIP Services for
# each BMC.
#
# How this differs from Override Mode (values/machine-a-tron.yaml):
#   - mat-k8s-controller.enabled: true — controller creates one Service per
#     BMC with ClusterIP = BMC IP assigned by NICo DHCP.
#   - site_explorer.bmc_proxy MUST BE UNSET in nico-core — site-explorer dials
#     each BMC's ClusterIP directly.
#   - Requires NICo siteConfig:
#       allow_insecure_discovery = true
#       [networks.MAT-BMC-SERVICES]
#       type = "underlay"
#       prefix = "10.96.64.0/18"
#       gateway = "10.96.64.1"
#       mtu = 1500
#   - oobDhcpRelayAddress must be within Kubernetes ServiceCIDR
# =============================================================================

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

global:
  imagePullSecrets:
    - name: machine-a-tron-pull

certificate:
  uris:
    - "spiffe://nico.local/nico-system/sa/machine-a-tron"

machineATron:
  nicoApiUrl: "https://nico-api.nico-system.svc.cluster.local:1079"
  configureBmcProxyHost: ""  # Not used in controller mode
  registerExpectedMachines: true
  useSingleBmcMock: true

# Enable auto-generated MAC pools (prevents collisions in multi-pod)
macAddressPool:
  enabled: true
  basePrefix: "02:00"

hwMacAddressRanges:
  enabled: true
  basePrefix: "02:01"

# Controller mode - dynamically creates Services with BMC IP as ClusterIP
mat-k8s-controller:
  enabled: true
  config:
    insecureSkipVerify: true  # For self-signed certs

# Larger resources for scale testing

# At thousands of hosts MAT registers all expected machines BEFORE binding
# the redfish port, so the chart-default liveness window (30s + 3×30s) kills
# the pod mid-init and it crash-loops (observed: 30 restarts at 4500 hosts,
# ~3 min per life, exit 137 from the kubelet). Give init up to 2h; steady-
# state kill detection matters less in a sim harness than surviving bring-up.
livenessProbe:
  tcpSocket:
    port: redfish
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 240
  successThreshold: 1
  timeoutSeconds: 10

readinessProbe:
  tcpSocket:
    port: redfish
  initialDelaySeconds: 5
  periodSeconds: 30
  failureThreshold: 240
  successThreshold: 1
  timeoutSeconds: 5

# Larger resources: one tokio task per host + per DPU; at thousands of
# machines the FSM/API chatter is CPU-bound.
resources:
  limits:
    cpu: "8"
    memory: 8Gi
  requests:
    cpu: "2"
    memory: 2Gi

pods:
  default: null  # Disable default pod
  mat-0:
    machines:
      compute:
        hwType: dell_poweredge_r750
        hostCount: 100
        dpuPerHostCount: 2
        vpcCount: 0
        subnetsPerVpc: 0
        dpuRebootDelay: 1
        hostRebootDelay: 1
        scoutRunInterval: "300s"
        runIntervalWorking: "5s"
        runIntervalIdle: "60s"
        networkStatusRunInterval: "120s"
        oobDhcpRelayAddress: "10.96.64.1"  # Must be within K8s ServiceCIDR
        adminDhcpRelayAddress: "192.168.176.1"
        networkVirtualizationType: ""
        dpusInNicMode: false

extraEnv:
  - name: RUST_LOG
    value: "info"
