{{- $bootstrapCa := default (dict) .Values.bootstrapCa -}}
{{- $bootstrapCaSource := default "legacy_download" (get $bootstrapCa "source") -}}
{{- $bootstrapCaUrl := default "" (get $bootstrapCa "url") -}}
{{- $bootstrapCaObject := default (dict) (get $bootstrapCa "object") -}}
{{- $bootstrapCaObjectKind := default "" (get $bootstrapCaObject "kind") -}}
{{- $bootstrapCaObjectName := default "" (get $bootstrapCaObject "name") -}}
{{- $bootstrapCaObjectKey := "ca.crt" -}}
{{- if hasKey $bootstrapCaObject "key" -}}
{{- $bootstrapCaObjectKey = get $bootstrapCaObject "key" -}}
{{- end -}}
{{- $certsDir := .Values.certsDir | default "/opt/nico" -}}
{{- $podAnnotations := .Values.serviceDaemonSet.annotations -}}
{{- if .Values.fmds.sign_proxy_url -}}
{{- $podAnnotations = omit $podAnnotations "checksum/machine-identity-config" -}}
{{- end -}}
{{- if not (has $bootstrapCaSource (list "legacy_download" "mounted")) -}}
{{- fail (printf "bootstrapCa.source must be one of legacy_download or mounted; got %q" $bootstrapCaSource) -}}
{{- end -}}
{{- if eq $bootstrapCaSource "legacy_download" -}}
  {{- if not (empty $bootstrapCaObject) -}}
  {{- fail "bootstrapCa.object is only valid when bootstrapCa.source is mounted" -}}
  {{- end -}}
{{- else -}}
  {{- if not (empty $bootstrapCaUrl) -}}
  {{- fail "bootstrapCa.url is only valid when bootstrapCa.source is legacy_download" -}}
  {{- end -}}
  {{- if not (has $bootstrapCaObjectKind (list "Secret" "ConfigMap")) -}}
  {{- fail "bootstrapCa.object.kind must be Secret or ConfigMap when bootstrapCa.source is mounted" -}}
  {{- end -}}
  {{- if empty $bootstrapCaObjectName -}}
  {{- fail "bootstrapCa.object.name is required when bootstrapCa.source is mounted" -}}
  {{- end -}}
  {{- if empty $bootstrapCaObjectKey -}}
  {{- fail "bootstrapCa.object.key must not be empty when bootstrapCa.source is mounted" -}}
  {{- end -}}
  {{- /* The init container installs the validated bundle at its fixed
         /opt/forge/forge_root.pem path, so the shared nico-certs hostPath must
         be mounted there. */ -}}
  {{- if ne $certsDir "/opt/forge" -}}
  {{- fail "bootstrapCa.source mounted requires certsDir=/opt/forge because the init container installs /opt/forge/forge_root.pem there" -}}
  {{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "nico-dpu-agent.fullname" . }}
  labels:
    {{- include "nico-dpu-agent.labels" . | nindent 4 }}
    {{- with .Values.serviceDaemonSet.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with .Values.serviceDaemonSet.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.serviceDaemonSet.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "nico-dpu-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with $podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.fmds.sign_proxy_url }}
        checksum/machine-identity-config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- end }}
      labels:
        {{- include "nico-dpu-agent.selectorLabels" . | nindent 8 }}
        {{- with .Values.serviceDaemonSet.labels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      dnsPolicy: ClusterFirst
      {{- if not (empty .Values.serviceDaemonSet.nodeSelector) }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
              {{- toYaml .Values.serviceDaemonSet.nodeSelector | nindent 12 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: nico-dpu-agent-init
          securityContext:
            privileged: true
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          args:
            - init-container
            {{- if eq $bootstrapCaSource "mounted" }}
            - "--bootstrap-ca-source=mounted"
            {{- else if not (empty $bootstrapCaUrl) }}
            - {{ printf "--bootstrap-ca-url=%s" $bootstrapCaUrl | quote }}
            {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RUST_BACKTRACE
              value: "full"
            - name: RUST_LIB_BACKTRACE
              value: "0"
            - name: RUST_LOG
              value: "info"
          volumeMounts:
            - name: hw-cache
              mountPath: /data
            - name: sys
              mountPath: /sys
            - name: dev
              mountPath: /dev
            - name: run-udev
              mountPath: /run/udev
            - name: proc-cpu-info
              mountPath: /host-cpu-info
            - name: proc-mem-info
              mountPath: /host-mem-info
            - name: nico-certs
              mountPath: {{ .Values.certsDir | default "/opt/nico" }}
            - name: host-resolv-conf
              mountPath: /host-resolv.conf
              readOnly: true
            {{- if eq $bootstrapCaSource "mounted" }}
            - name: bootstrap-ca-source
              mountPath: /var/run/secrets/nico-bootstrap-ca
              readOnly: true
            {{- end }}
      containers:
        - name: nico-dpu-agent
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          args:
            {{- with .Values.fmds.sign_proxy_url }}
            - "--config-path=/etc/forge/config.toml"
            {{- end }}
            - run
            - "--hbn-config-mode=nvue-rest"
            - "--agent-platform-type=containerized"
            - "--dhcp-grpc-server=http://carbide-dpf-cluster-{{ .Values.dhcp_server.service_name }}.dpf-operator-system.svc.cluster.local:10079"
            - "--fmds-grpc-server=http://carbide-dpf-cluster-{{ .Values.fmds.service_name }}.dpf-operator-system.svc.cluster.local:50052"
            {{- if not (empty .Values.dhcp_server.interface_prepend) }}
            - "--dhcp-server-interface-prepend={{ .Values.dhcp_server.interface_prepend }}"
            {{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with toYaml .Values.serviceDaemonSet.resources }}
          resources:
            limits:
              {{- . | nindent 14 }}
            requests:
              {{- . | nindent 14 }}
          {{- end }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP  # always resolves to cluster-internal IP
            - name: RUST_BACKTRACE
              value: "full"
            - name: RUST_LIB_BACKTRACE
              value: "0"
            - name: RUST_LOG
              value: "info"
            - name: AGENT_PLATFORM_TYPE
              value: "containerized"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: IGNORE_MGMT_VRF
              value: "1"
            - name: NVUE_HTTPS_ADDRESS
              value: carbide-dpf-cluster-{{ .Values.hbn.nvue_https_address }}.dpf-operator-system.svc.cluster.local:8765
            - name: NVUE_USERNAME
              value: "carbide"
            - name: NVUE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hbn.nvue_credentials_secret_name }}
                  key: {{ .Values.hbn.nvue_password_key }}
          volumeMounts:
            {{- with .Values.fmds.sign_proxy_url }}
            - name: agent-config
              mountPath: /etc/forge/config.toml
              subPath: config.toml
              readOnly: true
            {{- end }}
            - name: nico-certs
              mountPath: {{ .Values.certsDir | default "/opt/nico" }}
            - name: hw-cache
              mountPath: /data
              readOnly: true
        - name: nico-lldp-sidecar
          securityContext:
            privileged: false
            allowPrivilegeEscalation: true
            capabilities:
              drop:
                - ALL
              add:
                - DAC_OVERRIDE
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command:
            - /busybox/sh
            - -c
            - |
              set -u

              readonly snapshot_root=/data/lldp
              readonly snapshots_dir=${snapshot_root}/snapshots
              readonly refresh_interval=120
              readonly retry_interval=30
              readonly max_capture_attempts=3
              readonly lldpcli_timeout=10
              readonly lldpcli_kill_grace=2

              capture_snapshot() (
                set -e
                mkdir -p "${snapshots_dir}"
                chmod 0755 "${snapshot_root}" "${snapshots_dir}"
                temporary_dir=$(mktemp -d "${snapshots_dir}/.tmp.XXXXXX")
                temporary_link=
                cleanup() {
                  if [ -n "${temporary_dir:-}" ] && [ -d "${temporary_dir}" ]; then
                    rm -rf -- "${temporary_dir}"
                  fi
                  if [ -n "${temporary_link:-}" ] && [ -L "${temporary_link}" ]; then
                    rm -f -- "${temporary_link}"
                  fi
                }
                trap cleanup EXIT HUP INT TERM
                mkdir -p "${temporary_dir}/interface-macs"

                /busybox/timeout -k "${lldpcli_kill_grace}" "${lldpcli_timeout}" \
                  /usr/sbin/lldpcli -f json0 show neighbors details >"${temporary_dir}/neighbors.json"
                if [ ! -s "${temporary_dir}/neighbors.json" ]; then
                  echo "lldpcli returned an empty neighbor snapshot" >&2
                  exit 1
                fi
                if ! /busybox/timeout -k "${lldpcli_kill_grace}" "${lldpcli_timeout}" \
                  /usr/sbin/lldpcli -f json0 show chassis >"${temporary_dir}/chassis.json"; then
                  echo "could not collect local LLDP chassis; publishing neighbors without self-loop filtering" >&2
                  printf '{"local-chassis":[]}\n' >"${temporary_dir}/chassis.json"
                fi

                for address_path in /host-sys/class/net/*/address; do
                  [ -r "${address_path}" ] || continue
                  interface_dir=${address_path%/address}
                  interface_name=${interface_dir##*/}
                  mac=$(tr -d '\n' <"${address_path}")
                  [ -n "${mac}" ] || continue
                  printf '%s\n' "${mac}" >"${temporary_dir}/interface-macs/${interface_name}"
                done
                date +%s >"${temporary_dir}/captured-at"
                chmod 0644 "${temporary_dir}/neighbors.json" "${temporary_dir}/chassis.json" "${temporary_dir}/captured-at"
                find "${temporary_dir}/interface-macs" -type f -exec chmod 0644 {} +

                temporary_suffix=${temporary_dir##*/.tmp.}
                generation=snapshot-$(date +%s)-${temporary_suffix}
                published_dir=${snapshots_dir}/${generation}
                mv "${temporary_dir}" "${published_dir}"
                temporary_dir=
                temporary_link=${snapshot_root}/.current.$$
                ln -s "snapshots/${generation}" "${temporary_link}"
                mv -Tf "${temporary_link}" "${snapshot_root}/current"
                temporary_link=

                find "${snapshots_dir}" -mindepth 1 -maxdepth 1 -type d \
                  \( -name 'snapshot-*' -o -name '.tmp.*' \) -mmin +10 -exec rm -rf -- {} +
              )

              while true; do
                capture_attempt=1
                while true; do
                  capture_snapshot
                  capture_status=$?
                  if [ "${capture_status}" -eq 0 ]; then
                    break
                  fi
                  if [ "${capture_attempt}" -ge "${max_capture_attempts}" ]; then
                    echo "could not refresh LLDP sidecar snapshot after ${max_capture_attempts} attempts; exiting to restart the sidecar" >&2
                    exit 1
                  fi
                  echo "could not refresh LLDP sidecar snapshot; retaining the last successful snapshot and retrying in ${retry_interval} seconds" >&2
                  sleep "${retry_interval}"
                  capture_attempt=$((capture_attempt + 1))
                done
                sleep "${refresh_interval}"
              done
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: hw-cache
              mountPath: /data
            - name: host-run
              mountPath: /run
              readOnly: true
            - name: host-usr-sbin
              mountPath: /usr/sbin
              readOnly: true
            - name: host-lib
              mountPath: /lib
              readOnly: true
            - name: sys
              mountPath: /host-sys
              readOnly: true
      volumes:
        {{- with .Values.fmds.sign_proxy_url }}
        - name: agent-config
          configMap:
            name: {{ include "nico-dpu-agent.fullname" $ }}-config
        {{- end }}
        - name: nico-certs
          hostPath:
            path: {{ .Values.certsDir | default "/opt/nico" }}
            type: DirectoryOrCreate
        - name: hw-cache
          emptyDir: {}
        - name: host-run
          hostPath:
            path: /run
            type: Directory
        - name: host-usr-sbin
          hostPath:
            path: /usr/sbin
            type: Directory
        - name: host-lib
          hostPath:
            path: /lib
            type: Directory
        - name: sys
          hostPath:
            path: /sys
        - name: dev
          hostPath:
            path: /dev
        - name: run-udev
          hostPath:
            path: /run/udev
        - name: proc-cpu-info
          hostPath:
            path: /proc/cpuinfo
        - name: proc-mem-info
          hostPath:
            path: /proc/meminfo
        - name: host-resolv-conf
          hostPath:
            path: /etc/resolv.conf
            type: File
        {{- if eq $bootstrapCaSource "mounted" }}
        - name: bootstrap-ca-source
          {{- if eq $bootstrapCaObjectKind "Secret" }}
          secret:
            secretName: {{ $bootstrapCaObjectName | quote }}
            items:
              - key: {{ $bootstrapCaObjectKey | quote }}
                path: ca.pem
          {{- else }}
          configMap:
            name: {{ $bootstrapCaObjectName | quote }}
            items:
              - key: {{ $bootstrapCaObjectKey | quote }}
                path: ca.pem
          {{- end }}
        {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
