# THROWAWAY: compares apt mirror options for the arm64 mkosi build on the
# nv-gha-runners. Legs:
#   ports - http://ports.ubuntu.com/ubuntu-ports        (the flaky default baseline)
#   pdx   - NVIDIA PDX Artifactory ubuntu-ports-remote  (kept for the record; the
#           runners have no DNS/route to it, so this leg is expected to fail)
#   ocf   - https://mirrors.ocf.berkeley.edu/ubuntu-ports  (public fallback from #5253)
#   mit   - https://mirrors.mit.edu/ubuntu-ports          (public fallback from #5253)
#   edge        - https://edge.urm.nvidia.com/artifactory/ubuntu-ports-remote  (NVIDIA URM edge)
#   artifactory - https://artifactory.nvidia.com/artifactory/ubuntu-ports-remote  (NVIDIA URM)
# The NVIDIA Artifactory repo key (ubuntu-ports-remote) is assumed to match PDX;
# a DNS error vs a 404 in a leg's log tells "unreachable" apart from "wrong path".
#
# Each leg does three things: (1) a curl loop that rates raw connectivity
# (DNS/TCP/TLS/HTTP timing) independent of apt, (2) an apt-get update loop with
# retries off and the index cache wiped before every attempt so each try is a
# full download rather than a 304 conditional GET, and (3) a package fetch to
# confirm the pool serves the build's debs. This does NOT pull in #5253's action
# changes; it only exercises the mirror URLs. Safe to delete. Runs only on the
# test branch / PR mirror, never the full CI.
name: (throwaway) apt mirror validation

on:
  push:
    branches:
      - "test/pdx-mirror-validation"
      # NVIDIA's PR mirror pushes the PR head here, which is what actually runs
      # CI on origin. Needed so this probe runs from PR #5255.
      - "pull-request/5255"
  workflow_dispatch:
    inputs:
      iterations:
        description: "attempts per mirror (curl and apt each)"
        default: "10"
      runner:
        description: "runner label"
        default: "linux-arm64-cpu16"

permissions:
  contents: read

jobs:
  mirror-check:
    name: "mirror: ${{ matrix.mirror }}"
    runs-on: ${{ inputs.runner || 'linux-arm64-cpu16' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mirror: [ports, pdx, ocf, mit, edge, artifactory]
    steps:
      - name: Probe ${{ matrix.mirror }} mirror
        shell: bash
        env:
          MIRROR: ${{ matrix.mirror }}
          ITERATIONS: ${{ inputs.iterations || '10' }}
        run: |
          set -uo pipefail

          . /etc/os-release
          codename="${VERSION_CODENAME:?missing VERSION_CODENAME}"
          echo "runner=$(uname -m) dpkg=$(dpkg --print-architecture) codename=${codename} mirror=${MIRROR}"

          # Measure the mirror directly, not through any apt proxy cache.
          sudo tee /etc/apt/apt.conf.d/99-validate-direct >/dev/null <<'EOF'
          Acquire::http::Proxy "DIRECT";
          Acquire::https::Proxy "DIRECT";
          EOF

          # Isolate to one mirror so only the ubuntu archive is measured.
          sudo mkdir -p /etc/apt/sources.list.d.bak
          sudo bash -c 'mv /etc/apt/sources.list.d/* /etc/apt/sources.list.d.bak/ 2>/dev/null || true'

          case "${MIRROR}" in
            ports) base="http://ports.ubuntu.com/ubuntu-ports" ;;
            pdx)   base="https://artifactory.pdx.nvidia.com/artifactory/ubuntu-ports-remote" ;;
            ocf)   base="https://mirrors.ocf.berkeley.edu/ubuntu-ports" ;;
            mit)   base="https://mirrors.mit.edu/ubuntu-ports" ;;
            # NVIDIA Artifactory repo key assumed to match PDX's ubuntu-ports-remote.
            edge)        base="https://edge.urm.nvidia.com/artifactory/ubuntu-ports-remote" ;;
            artifactory) base="https://artifactory.nvidia.com/artifactory/ubuntu-ports-remote" ;;
            *)     echo "unknown mirror ${MIRROR}"; exit 1 ;;
          esac

          sudo tee /etc/apt/sources.list >/dev/null <<EOF
          deb ${base} ${codename} main restricted universe multiverse
          deb ${base} ${codename}-updates main restricted universe multiverse
          deb ${base} ${codename}-backports main restricted universe multiverse
          deb ${base} ${codename}-security main restricted universe multiverse
          EOF

          echo "=== sources ==="
          cat /etc/apt/sources.list

          n="${ITERATIONS}"

          # --- Raw connectivity via curl, independent of apt. Hits the top-level
          # InRelease directly and records DNS/TCP/TLS/total timing plus status.
          # rc != 0 is a transport failure (DNS/TCP/TLS); an HTTP code that is
          # not 200/304 means the host is reachable but the path is wrong.
          url="${base}/dists/${codename}/InRelease"
          echo "=== curl connectivity: ${url} ==="
          c_fails=0
          c_total_ms=0
          last_rc=0
          last_code=000
          for i in $(seq 1 "$n"); do
            out=$(curl -sS -o /dev/null --max-time 15 --noproxy '*' \
                  -w '%{http_code} %{time_namelookup} %{time_connect} %{time_appconnect} %{time_total}' \
                  "$url" 2>/tmp/curlerr.log)
            rc=$?
            code=$(printf '%s' "$out" | awk '{print $1}')
            dns=$(printf '%s' "$out" | awk '{print $2}')
            conn=$(printf '%s' "$out" | awk '{print $3}')
            tls=$(printf '%s' "$out" | awk '{print $4}')
            tot=$(printf '%s' "$out" | awk '{print $5}')
            tms=$(awk -v t="${tot:-0}" 'BEGIN{printf "%d", t*1000}')
            c_total_ms=$((c_total_ms + tms))
            last_rc=$rc
            last_code=${code:-000}
            if [ "$rc" -eq 0 ] && { [ "$code" = 200 ] || [ "$code" = 304 ]; }; then
              cst=ok
            else
              cst=FAIL
              c_fails=$((c_fails + 1))
            fi
            printf 'curl %2d/%s  %-4s  rc=%-2s http=%s  dns=%ss conn=%ss tls=%ss total=%sms\n' \
              "$i" "$n" "$cst" "$rc" "${code:-000}" "${dns:-?}" "${conn:-?}" "${tls:-?}" "$tms"
            [ "$cst" = FAIL ] && { echo "  curl stderr:"; cat /tmp/curlerr.log; } || true
          done
          c_avg=$((c_total_ms / n))
          echo "RESULT-CURL mirror=${MIRROR} curl_fails=${c_fails}/${n} avg=${c_avg}ms last_rc=${last_rc} last_http=${last_code}"

          # --- apt-get update reliability. Retries off and the index cache wiped
          # before each attempt so every try is a full download, not a 304.
          fails=0
          total=0
          for i in $(seq 1 "$n"); do
            sudo rm -rf /var/lib/apt/lists/*
            sudo mkdir -p /var/lib/apt/lists/partial
            s=$(date +%s%3N)
            if sudo apt-get update \
                 -o Acquire::Retries=0 \
                 -o Acquire::http::Timeout=10 \
                 -o Acquire::https::Timeout=10 \
                 -o Acquire::http::No-Cache=true \
                 -o Acquire::https::No-Cache=true >/tmp/u.log 2>&1; then
              st=ok
            else
              st=FAIL
              fails=$((fails + 1))
            fi
            e=$(date +%s%3N)
            d=$((e - s))
            total=$((total + d))
            printf 'update %2d/%s  %-4s  %6dms\n' "$i" "$n" "$st" "$d"
            [ "$st" = FAIL ] && tail -n 12 /tmp/u.log || true
          done
          avg=$((total / n))
          echo "RESULT mirror=${MIRROR} update_fails=${fails}/${n} avg=${avg}ms"

          # Summary table (curl + apt), recorded before the fallible fetch below.
          {
            echo "### ${MIRROR}"
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| mirror | \`${base}\` |"
            echo "| curl connectivity failures | ${c_fails}/${n} |"
            echo "| avg curl time | ${c_avg} ms |"
            echo "| last curl result | rc=${last_rc} http=${last_code} |"
            echo "| apt-get update failures | ${fails}/${n} |"
            echo "| avg update time | ${avg} ms |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Confirm the pool actually serves the real build packages (just the
          # .debs, no dependency install) across main and universe.
          fetch=fail
          cd /tmp
          if sudo apt-get update -o Acquire::Retries=3 >/dev/null 2>&1 \
             && apt-get download mkosi debootstrap squashfs-tools protobuf-compiler libssl-dev >/tmp/dl.log 2>&1; then
            fetch=ok
          fi
          echo "| package fetch (mkosi, debootstrap, squashfs-tools, protobuf-compiler, libssl-dev) | ${fetch} |" >> "$GITHUB_STEP_SUMMARY"
          echo "package fetch: ${fetch}"
          [ "${fetch}" = ok ] || cat /tmp/dl.log || true

          # All legs are informational so the comparison stays green and the
          # numbers in the job summary are the deliverable.
