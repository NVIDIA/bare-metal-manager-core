suite: Flow deployment contract
templates:
  - deployment.yaml
tests:
  - it: deploys only the Flow container
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: flow
      - equal:
          path: spec.selector.matchLabels
          value:
            app: flow
            app.kubernetes.io/name: flow
      - equal:
          path: spec.template.metadata.labels.app
          value: flow
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: flow
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: PSM_API_URL
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NSM_API_URL
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: psm-firmware
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: nsm-scratch
