{{- $root := . }}
{{- $namespace := include "nico-machine-a-tron.namespace" . }}
{{- $baseName := include "nico-machine-a-tron.name" . }}

{{/*
Count pods that should be deployed (pods with machines defined)
*/}}
{{- $activePods := 0 }}
{{- range $podName, $podConfig := .Values.pods }}
{{- if and $podConfig.machines (gt (len $podConfig.machines) 0) }}
{{- $activePods = add $activePods 1 }}
{{- end }}
{{- end }}

{{- range $podName, $podConfig := .Values.pods }}
{{/*
Skip pods without machines (or empty machines)
*/}}
{{- if not (and $podConfig.machines (gt (len $podConfig.machines) 0)) }}
{{- continue }}
{{- end }}

{{- $name := $baseName }}
{{- if gt $activePods 1 }}
{{- $name = printf "%s-%s" $baseName $podName }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "nico-machine-a-tron.labels" $root | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nico-machine-a-tron.selectorLabels" $root | nindent 6 }}
      {{- if gt $activePods 1 }}
      nvidia-infra-controller/pod-name: {{ $podName | quote }}
      {{- end }}
  template:
    metadata:
      labels:
        {{- include "nico-machine-a-tron.selectorLabels" $root | nindent 8 }}
        {{- if gt $activePods 1 }}
        nvidia-infra-controller/pod-name: {{ $podName | quote }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
    spec:
      serviceAccountName: {{ include "nico-machine-a-tron.name" $root }}
      containers:
        - name: machine-a-tron
          image: {{ include "nico-machine-a-tron.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args:
            - "--config=/app/mat.toml"
          ports:
            - name: bmc-mock
              containerPort: {{ $root.Values.service.bmcMock.port }}
              protocol: TCP
          {{- with $root.Values.machineATron.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $root.Values.machineATron.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/mat.toml
              subPath: mat.toml
            - name: tls
              mountPath: /certs
              readOnly: true
            {{- if $root.Values.persistence.enabled }}
            - name: data
              mountPath: {{ $root.Values.machineATron.persistDirectory }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config-files
        - name: tls
          secret:
            secretName: {{ $name }}-tls
        {{- if $root.Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
        {{- end }}
{{- end }}
