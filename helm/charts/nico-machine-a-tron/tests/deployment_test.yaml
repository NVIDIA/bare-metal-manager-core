suite: deployment tests
templates:
  - configmap.yaml
  - deployment.yaml
  - pvc.yaml
tests:
  - it: should mount tls secret generated by certificate
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: nico-machine-a-tron-mat-0-tls
        template: deployment.yaml

  - it: should expose named ports used by Services and probes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /opt/machine-a-tron/bin/machine-a-tron
        template: deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: /app/mat.toml
        template: deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls
            mountPath: /var/run/secrets/spiffe.io
            readOnly: true
        template: deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: redfish
        template: deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 1266
        template: deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].ports[1].name
          value: ssh
        template: deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 2222
        template: deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: redfish
        template: deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: redfish
        template: deployment.yaml

  - it: should omit ssh container port when ssh mock is disabled
    set:
      machineATron:
        mockBmcSshServer: false
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 1
        template: deployment.yaml

  - it: should mount persisted machine state when persistence is enabled
    set:
      persistence:
        enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /tmp/machine-a-tron-data
        template: deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: nico-machine-a-tron-mat-0-data
        template: deployment.yaml
      - equal:
          path: metadata.name
          value: nico-machine-a-tron-mat-0-data
        template: pvc.yaml
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteOnce
        template: pvc.yaml
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi
        template: pvc.yaml
      - notExists:
          path: spec.storageClassName
        template: pvc.yaml

  - it: should mount per-pod tls secrets in multi-pod mode
    set:
      mat-k8s-controller:
        enabled: true
      pods:
        mat-0:
          machines:
            compute:
              hwType: supermicro_gb300_nvl
              hostCount: 5
        mat-1:
          machines:
            compute:
              hwType: supermicro_gb300_nvl
              hostCount: 5
    asserts:
      - hasDocuments:
          count: 2
        template: deployment.yaml
      - equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: nico-machine-a-tron-mat-0-tls
        documentIndex: 0
        template: deployment.yaml
      - equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: nico-machine-a-tron-mat-1-tls
        documentIndex: 1
        template: deployment.yaml

  - it: should deploy a rack-only pod
    set:
      pods:
        mat-0: null
        rack-sim:
          racks:
            gb200:
              type: wiwynn_gb200_nvl72
              rack_profile_id: NVL72
              ids:
                - rack-001
              oob_dhcp_relay_address: 10.96.64.1
              admin_dhcp_relay_address: 192.168.176.1
    asserts:
      - equal:
          path: metadata.name
          value: nico-machine-a-tron-rack-sim
        template: deployment.yaml

  - it: should render startupProbe by default to prevent liveness killing during registration
    template: deployment.yaml
    asserts:
      - isNotNull:
          path: spec.template.spec.containers[0].startupProbe
      - equal:
          path: spec.template.spec.containers[0].startupProbe.tcpSocket.port
          value: redfish
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 20

  - it: should fail when startupProbe is explicitly nulled (recreates issue 4298)
    template: deployment.yaml
    set:
      startupProbe: null
    asserts:
      - failedTemplate:
          errorMessage: "startupProbe must be configured — without it liveness fires immediately and can kill MAT during registration (issue #4298)"
