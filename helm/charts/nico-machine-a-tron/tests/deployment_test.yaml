suite: deployment tests
templates:
  - configmap.yaml
  - deployment.yaml
  - pvc.yaml
tests:
  - it: should mount tls secret generated by certificate
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: nico-machine-a-tron-mat-0-tls
        template: deployment.yaml

  - it: should expose named ports used by Services and probes
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - /opt/machine-a-tron/bin/machine-a-tron
        template: deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].args
          content: /app/mat.toml
        template: deployment.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls
            mountPath: /var/run/secrets/spiffe.io
            readOnly: true
        template: deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: redfish
        template: deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 1266
        template: deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].ports[1].name
          value: ssh
        template: deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 2222
        template: deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: redfish
        template: deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: redfish
        template: deployment.yaml

  - it: should expose NMX-C container port when enabled for a pod
    set:
      pods:
        mat-0:
          nmxc:
            enabled: true
            port: 9602
            endpoint: "http://nico-machine-a-tron-mat-0-bmc-mock.nico-system.svc.cluster.local:9602"
            domainUuid: "8f3b6a62-12c4-4e7f-9a31-6d5c8b2f1047"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[2].name
          value: nmxc
        template: deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].ports[2].containerPort
          value: 9602
        template: deployment.yaml

  - it: should omit ssh container port when ssh mock is disabled
    set:
      machineATron:
        mockBmcSshServer: false
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[0].ports
          count: 1
        template: deployment.yaml

  - it: should mount persisted machine state when persistence is enabled
    set:
      persistence:
        enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: data
            mountPath: /tmp/machine-a-tron-data
        template: deployment.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: data
            persistentVolumeClaim:
              claimName: nico-machine-a-tron-mat-0-data
        template: deployment.yaml
      - equal:
          path: metadata.name
          value: nico-machine-a-tron-mat-0-data
        template: pvc.yaml
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteOnce
        template: pvc.yaml
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi
        template: pvc.yaml
      - notExists:
          path: spec.storageClassName
        template: pvc.yaml

  - it: should mount per-pod tls secrets in multi-pod mode
    set:
      mat-k8s-controller:
        enabled: true
      pods:
        mat-0:
          machines:
            compute:
              hwType: supermicro_gb300_nvl
              hostCount: 5
        mat-1:
          machines:
            compute:
              hwType: supermicro_gb300_nvl
              hostCount: 5
    asserts:
      - hasDocuments:
          count: 2
        template: deployment.yaml
      - equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: nico-machine-a-tron-mat-0-tls
        documentIndex: 0
        template: deployment.yaml
      - equal:
          path: spec.template.spec.volumes[1].secret.secretName
          value: nico-machine-a-tron-mat-1-tls
        documentIndex: 1
        template: deployment.yaml
