suite: configmap tests
templates:
  - configmap.yaml
tests:
  - it: should create configmap with default machine config
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: nico-machine-a-tron-mat-0-config-files
      - matchRegex:
          path: data["mat.toml"]
          pattern: "host_count = 10"
      - matchRegex:
          path: data["mat.toml"]
          pattern: "use_single_bmc_mock = true"
      - notMatchRegex:
          path: data["mat.toml"]
          pattern: '\[nmxc\]'

  - it: should configure NMX-C when enabled for a pod
    set:
      pods:
        mat-0:
          nmxc:
            enabled: true
            port: 9602
            endpoint: "http://nico-machine-a-tron-mat-0-bmc-mock.nico-system.svc.cluster.local:9602"
            domainUuid: "8f3b6a62-12c4-4e7f-9a31-6d5c8b2f1047"
            registerEndpoints: true
    asserts:
      - matchRegex:
          path: data["mat.toml"]
          pattern: '\[nmxc\]'
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'port = 9602'
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'endpoint = "http://nico-machine-a-tron-mat-0-bmc-mock.nico-system.svc.cluster.local:9602"'
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'domain_uuid = "8f3b6a62-12c4-4e7f-9a31-6d5c8b2f1047"'
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'register_endpoints = true'

  - it: should reject NMX-C with more than one active pod
    set:
      pods:
        mat-0:
          nmxc:
            enabled: true
            port: 9602
            endpoint: "http://nico-machine-a-tron-mat-0-bmc-mock.nico-system.svc.cluster.local:9602"
            domainUuid: "8f3b6a62-12c4-4e7f-9a31-6d5c8b2f1047"
        mat-1:
          machines:
            compute:
              hwType: wiwynn_gb200_nvl
              hostCount: 2
    asserts:
      - failedTemplate:
          errorMessage: "NMX-C simulation requires exactly one active machine-a-tron pod"

  - it: should configure custom host count via pods structure
    set:
      pods:
        mat-0:
          machines:
            dell-hosts:
              hwType: dell_poweredge_r750
              hostCount: 20
              dpuPerHostCount: 2
    asserts:
      - matchRegex:
          path: data["mat.toml"]
          pattern: "host_count = 20"
      - matchRegex:
          path: data["mat.toml"]
          pattern: "dpu_per_host_count = 2"
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'hw_type = "dell_poweredge_r750"'

  - it: should allow full config override via matConfigs
    set:
      configFiles:
        matConfigs:
          mat-0: |
            carbide_api_url = "https://custom-api:443"
            [machines.custom]
            host_count = 5
    asserts:
      - matchRegex:
          path: data["mat.toml"]
          pattern: "custom-api"

  - it: should create per-pod configmaps in multi-pod mode
    set:
      pods:
        mat-0:
          machines:
            compute:
              hwType: supermicro_gb300_nvl
              hostCount: 10
        mat-1:
          machines:
            compute:
              hwType: supermicro_gb300_nvl
              hostCount: 20
    asserts:
      - hasDocuments:
          count: 2

  - it: should use machineDefaults for all machine groups
    set:
      machineDefaults:
        runIntervalIdle: "30s"
        scoutRunInterval: "120s"
      pods:
        mat-0:
          machines:
            compute:
              hwType: supermicro_gb300_nvl
              hostCount: 5
    asserts:
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'run_interval_idle = "30s"'
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'scout_run_interval = "120s"'
