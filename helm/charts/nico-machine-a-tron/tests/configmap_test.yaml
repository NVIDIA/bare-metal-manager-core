suite: configmap tests
templates:
  - configmap.yaml
tests:
  - it: should create configmap with default machine config
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: nico-machine-a-tron-mat-0-config-files
      - matchRegex:
          path: data["mat.toml"]
          pattern: "host_count = 10"
      - matchRegex:
          path: data["mat.toml"]
          pattern: "use_single_bmc_mock = true"
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'log_format = "logfmt"'
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'discovery_retry_interval = "60s"'

  - it: should allow compact log output
    set:
      machineATron:
        logFormat: compact
    asserts:
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'log_format = "compact"'

  - it: should configure custom host count via pods structure
    set:
      pods:
        mat-0:
          machines:
            dell-hosts:
              hwType: dell_poweredge_r750
              hostCount: 20
              dpuPerHostCount: 2
              underlayDhcpRelayAddress: 192.168.176.1
    asserts:
      - matchRegex:
          path: data["mat.toml"]
          pattern: "host_count = 20"
      - matchRegex:
          path: data["mat.toml"]
          pattern: "dpu_per_host_count = 2"
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'hw_type = "dell_poweredge_r750"'

  - it: should allow full config override via matConfigs
    set:
      configFiles:
        matConfigs:
          mat-0: |
            carbide_api_url = "https://custom-api:443"
            [machines.custom]
            host_count = 5
    asserts:
      - matchRegex:
          path: data["mat.toml"]
          pattern: "custom-api"

  - it: should create per-pod configmaps in multi-pod mode
    set:
      pods:
        mat-0:
          machines:
            compute:
              hwType: supermicro_gb300_nvl
              hostCount: 10
              underlayDhcpRelayAddress: 192.168.176.1
              hostInbandDhcpRelayAddress: 192.168.177.1
        mat-1:
          machines:
            compute:
              hwType: supermicro_gb300_nvl
              hostCount: 20
              underlayDhcpRelayAddress: 192.168.176.1
              hostInbandDhcpRelayAddress: 192.168.177.1
    asserts:
      - hasDocuments:
          count: 2

  - it: should render an atomic rack
    set:
      pods:
        mat-0:
          machines:
            rack-machines: null
          racks:
            gb200:
              type: wiwynn_gb200_nvl72
              rack_profile_id: NVL72
              ids:
                - rack-001
              dpu_reboot_delay: 20
              host_reboot_delay: 10
              bmc_dhcp_relay_address: 10.96.64.1
              underlay_dhcp_relay_address: 192.168.176.1
    asserts:
      - matchRegex:
          path: data["mat.toml"]
          pattern: '\[racks\.gb200\]'
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'rack_profile_id = "NVL72"'
      - matchRegex:
          path: data["mat.toml"]
          pattern: '\[machines\]'
      - notMatchRegex:
          path: data["mat.toml"]
          pattern: '\[machines\.rack-machines\]'

  - it: should render racks and machines together
    set:
      pods:
        mat-0:
          racks:
            gb200:
              type: wiwynn_gb200_nvl72
              rack_profile_id: NVL72
              ids:
                - rack-001
              dpu_reboot_delay: 20
              host_reboot_delay: 10
              bmc_dhcp_relay_address: 10.96.64.1
              underlay_dhcp_relay_address: 192.168.176.1
    asserts:
      - matchRegex:
          path: data["mat.toml"]
          pattern: '\[racks\.gb200\]'
      - matchRegex:
          path: data["mat.toml"]
          pattern: '\[machines\.rack-machines\]'

  - it: should require a BMC relay for every rack
    set:
      pods:
        mat-0:
          machines:
            rack-machines: null
          racks:
            gb200:
              type: wiwynn_gb200_nvl72
              rack_profile_id: NVL72
              ids:
                - rack-001
              underlay_dhcp_relay_address: 192.168.176.1
    asserts:
      - failedTemplate:
          errorMessage: "pods.mat-0.racks.gb200.bmc_dhcp_relay_address is required"

  - it: should use machineDefaults for all machine groups
    set:
      machineDefaults:
        runIntervalIdle: "30s"
        scoutRunInterval: "120s"
        discoveryRetryInterval: "7s"
      pods:
        mat-0:
          machines:
            compute:
              hwType: supermicro_gb300_nvl
              hostCount: 5
              underlayDhcpRelayAddress: 192.168.176.1
              hostInbandDhcpRelayAddress: 192.168.177.1
    asserts:
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'run_interval_idle = "30s"'
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'scout_run_interval = "120s"'
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'discovery_retry_interval = "7s"'

  - it: should require an Underlay relay for every machine group
    set:
      pods:
        mat-0:
          machines:
            rack-machines: null
            compute:
              hwType: supermicro_gb300_nvl
              hostCount: 1
    asserts:
      - failedTemplate:
          errorMessage: "pods.mat-0.machines.compute.underlayDhcpRelayAddress is required"

  - it: should render a HostInband relay for a zero-DPU machine group
    set:
      pods:
        mat-0:
          machines:
            rack-machines: null
            compute:
              hwType: supermicro_gb300_nvl
              hostCount: 1
              underlayDhcpRelayAddress: 192.168.176.1
              hostInbandDhcpRelayAddress: 192.168.177.1
    asserts:
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'host_inband_dhcp_relay_address = "192.168.177.1"'

  - it: should require a HostInband relay for a zero-DPU machine group
    set:
      pods:
        mat-0:
          machines:
            rack-machines: null
            compute:
              hwType: supermicro_gb300_nvl
              hostCount: 1
              underlayDhcpRelayAddress: 192.168.176.1
    asserts:
      - failedTemplate:
          errorMessage: "pods.mat-0.machines.compute.hostInbandDhcpRelayAddress is required when dpuPerHostCount is 0 or dpusInNicMode is true"

  - it: should require a HostInband relay for a NIC-mode machine group
    set:
      pods:
        mat-0:
          machines:
            rack-machines: null
            compute:
              hwType: supermicro_gb300_nvl
              hostCount: 1
              dpuPerHostCount: 2
              dpusInNicMode: true
              underlayDhcpRelayAddress: 192.168.176.1
    asserts:
      - failedTemplate:
          errorMessage: "pods.mat-0.machines.compute.hostInbandDhcpRelayAddress is required when dpuPerHostCount is 0 or dpusInNicMode is true"

  - it: should preserve a false machine-group dpusInNicMode override
    set:
      machineDefaults:
        dpusInNicMode: true
      pods:
        mat-0:
          machines:
            rack-machines: null
            compute:
              hwType: supermicro_gb300_nvl
              hostCount: 1
              dpuPerHostCount: 2
              dpusInNicMode: false
              underlayDhcpRelayAddress: 192.168.176.1
    asserts:
      - matchRegex:
          path: data["mat.toml"]
          pattern: 'dpus_in_nic_mode = false'

  - it: should not include enable_ipmi_simulation by default
    asserts:
      - notMatchRegex:
          path: data["mat.toml"]
          pattern: "enable_ipmi_simulation"

  - it: should include enable_ipmi_simulation when enabled
    set:
      machineATron:
        enableIpmiSimulation: true
    asserts:
      - matchRegex:
          path: data["mat.toml"]
          pattern: "enable_ipmi_simulation = true"

  - it: should not include ipmi_reachable_port by default
    asserts:
      - notMatchRegex:
          path: data["mat.toml"]
          pattern: "ipmi_reachable_port"

  - it: should include ipmi_reachable_port when set to 0 for dynamic
    set:
      machineATron:
        enableIpmiSimulation: true
        ipmiReachablePort: 0
    asserts:
      - matchRegex:
          path: data["mat.toml"]
          pattern: "ipmi_reachable_port = 0"

  - it: should include ipmi_reachable_port when set to custom value
    set:
      machineATron:
        enableIpmiSimulation: true
        ipmiReachablePort: 12345
    asserts:
      - matchRegex:
          path: data["mat.toml"]
          pattern: "ipmi_reachable_port = 12345"
