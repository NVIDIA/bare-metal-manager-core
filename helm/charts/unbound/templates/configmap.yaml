apiVersion: v1
kind: ConfigMap
metadata:
  name: unbound-envvars
  namespace: {{ include "unbound.namespace" . }}
  labels:
    {{- include "unbound.labels" . | nindent 4 }}
  annotations:
    {{- include "unbound.annotations" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unbound-local-config
  namespace: {{ include "unbound.namespace" . }}
  labels:
    {{- include "unbound.labels" . | nindent 4 }}
  annotations:
    {{- include "unbound.annotations" . | nindent 4 }}
data:
  {{- /*
       Render every entry under .Values.localConfig as its own file in the
       ConfigMap. This allows callers to add arbitrary `*.conf` files
       (e.g. `local_data.conf` with `.forge` zone records) without modifying
       this template. Each entry's key becomes the filename and its value
       is mounted at /etc/unbound/local.conf.d/<key> by the Deployment.
  */}}
  {{- range $filename, $contents := .Values.localConfig }}
  {{ $filename }}: |
{{ $contents | indent 4 }}
  {{- end }}
