suite: REST API direct DPS configuration
templates:
  - configmap.yaml
set:
  config.keycloak.enabled: true
tests:
  - it: accepts the default external mode
    asserts:
      - isKind:
          of: ConfigMap

  - it: rejects an unsupported power-provisioning mode
    set:
      config.powerProvisioning.mode: invalid
    asserts:
      - failedTemplate:
          errorMessage: config.powerProvisioning.mode must be external or dps

  - it: requires an endpoint in direct mode
    set:
      config.powerProvisioning.mode: dps
      secrets.dps: nico-dps-client
    asserts:
      - failedTemplate:
          errorMessage: config.powerProvisioning.dps.endpoint is required when direct DPS integration is enabled

  - it: requires an existing credentials Secret in direct mode
    set:
      config.powerProvisioning.mode: dps
      config.powerProvisioning.dps.endpoint: dps.example.test:443
    asserts:
      - failedTemplate:
          errorMessage: secrets.dps is required when direct DPS integration is enabled
