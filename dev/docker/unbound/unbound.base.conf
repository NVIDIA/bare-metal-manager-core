#
# Base unbound config for the site-built forge-unbound image.
#
# Every `*.conf` file mounted by the helm chart at
# /etc/unbound/local.conf.d/ is included via the wildcard `include:` below.
# That directory holds, at minimum:
#   - access_control.conf
#   - forwarders.conf            (forward .  -> upstream resolvers)
#   - forge_local_unknowndomain.conf
#   - local_data.conf            (the .forge zone)
#   - verbosity.conf
#   - extended_statistics.conf
#
# See helm/charts/unbound/values.yaml for the defaults and
# dev/deployment/devspace/values.base.yaml for the site overrides.

server:
    # Network — listen on all interfaces so the Pod can serve both the
    # in-cluster ClusterIP Service and the MetalLB LoadBalancer Service.
    interface: 0.0.0.0
    interface: ::0
    port: 53
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes

    # Runtime — drop privileges (chroot disabled since we run unprivileged
    # in Kubernetes and have no setuid binary to assist).
    username: ""
    chroot: ""
    directory: "/etc/unbound"
    pidfile: ""

    # Reasonable defaults for a small per-site resolver.  Tune via the
    # chart's localConfig if you need to (`*.conf` overrides win).
    num-threads: 2
    msg-cache-size: 16m
    rrset-cache-size: 32m
    cache-min-ttl: 30
    cache-max-ttl: 3600
    prefetch: yes
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    hide-identity: yes
    hide-version: yes

    # Trust anchor for DNSSEC validation; entrypoint.sh deletes this file
    # when BROKEN_DNSSEC=1, which keeps validation off for the synthetic
    # `.forge` zone the chart serves locally.
    auto-trust-anchor-file: "/opt/unbound/etc/unbound/root.key"

    # Pull in every chart-managed conf file.  unbound is happy with
    # missing files via include-toplevel: silent failures only emit a
    # debug message.
    include-toplevel: "/etc/unbound/local.conf.d/*.conf"

remote-control:
    # The unbound_exporter sidecar reads these keys from the shared
    # emptyDir volume populated by `unbound-control-setup` in
    # entrypoint.sh on first boot.
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953
    server-key-file: "/etc/unbound/keys/unbound_server.key"
    server-cert-file: "/etc/unbound/keys/unbound_server.pem"
    control-key-file: "/etc/unbound/keys/unbound_control.key"
    control-cert-file: "/etc/unbound/keys/unbound_control.pem"
